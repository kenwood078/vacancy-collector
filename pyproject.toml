[project]
name = "vacancy-collector"
version = "0.1.0"
description = "Vacancy collector and analyst for hh.ru using CrewAI"
authors = [{ name = "John", email = "john@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.18,<2.0.0",
    "psycopg2-binary",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "json5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["."]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "aef466c0-4323-43c6-8830-4d455116c3b8"